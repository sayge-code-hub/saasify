name: saasify
description: Spec-driven Flutter SaaS foundation for web and mobile (BLoC).
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  collection: ^1.19.1
  cupertino_icons: ^1.0.8
  equatable: ^3.0.0
  flutter_bloc: ^9.1.1
  go_router: ^18.0.1
  web: ^1.1.1
  url_launcher: ^6.3.2
dev_dependencies:
  bloc_test: ^10.0.0
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.5

flutter:
  uses-material-design: true
  assets:
    - assets/brand/logo_mark.png
    - assets/brand/logo_mark_256.png
    - assets/brand/logo_mark_transparent.png
    - assets/brand/logo_wordmark.png
    - assets/brand/group.png
    - assets/brand/logo_mark.svg
