<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Saasify — customer support admin workspace">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Saasify">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Saasify</title>
  <link rel="manifest" href="manifest.json">

  <!-- Brand fonts (CSS, not runtime Dart fetch) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Source+Sans+3:wght@400;600&display=swap"
    rel="stylesheet"
  >

  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #F3F6F8;
      font-family: "Source Sans 3", "Segoe UI", sans-serif;
    }
    #loading {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      color: #0F1C24;
    }
    #loading .brand {
      font-family: Fraunces, Georgia, serif;
      font-size: 2rem;
      font-weight: 600;
      letter-spacing: -0.03em;
    }
    #loading .hint {
      color: #4A5C68;
      font-size: 0.95rem;
    }
    #loading .spinner {
      width: 28px;
      height: 28px;
      border: 2px solid #D5DEE5;
      border-top-color: #0F766E;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="loading">
    <div class="brand">Saasify</div>
    <div class="spinner" aria-hidden="true"></div>
    <div class="hint">Loading workspace…</div>
  </div>

  <script>
    window.addEventListener('flutter-first-frame', function () {
      var el = document.getElementById('loading');
      if (el) el.remove();
    });

    // Surface hangs instead of an infinite spinner.
    setTimeout(function () {
      var el = document.getElementById('loading');
      if (!el) return;
      var hint = el.querySelector('.hint');
      if (hint) {
        hint.textContent =
          'Still loading… Try a hard refresh (Ctrl+Shift+R). ' +
          'If it stays blank, open this URL in Chrome.';
      }
    }, 20000);

    window.addEventListener('error', function (event) {
      var el = document.getElementById('loading');
      if (!el) return;
      var hint = el.querySelector('.hint');
      if (hint) {
        hint.textContent = 'Failed to start: ' + (event.message || 'unknown error');
      }
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
